name: Level CI Analysis
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - branch-*
      - develop
      - "release/**"
      - "hotfix/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm packages
        run: npm ci
        env:
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run Playwright tests
        run: npm run test:playwright

      - name: Level CI Accessibility Analysis
        uses: levelaccess/level-ci@dev
        env:
          LEVEL_CI_TOKEN: ${{ secrets.LEVEL_CI_TOKEN }}
        with:
          secondary_repository_key: project-b
          branch: main
          commit_hash: a4d91f7c8b2e5d6a3c9f1e8b7d4a2c5f9e1b6d3a
          token: ${{ secrets.LEVEL_CI_TOKEN }}
          report_paths: './level-ci-reports'